app = "openanc"
primary_region = "iad"

[build]

[env]
  DJANGO_DEBUG = "False"
  DJANGO_ALLOWED_HOSTS = "openanc.fly.dev,openanc.org,www.openanc.org"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://openanc.fly.dev,https://openanc.org,https://www.openanc.org"

# DATABASE_URL (Postgres) and DJANGO_SECRET_KEY are Fly secrets, not set here.
[deploy]
  release_command = "python manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    [http_service.checks.headers]
      Host = "openanc.fly.dev"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
